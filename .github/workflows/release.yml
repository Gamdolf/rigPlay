# release.yml: on a tag v*, checks the tag against VERSION and CHANGELOG.md, builds the tablet APK and
# the SimHub plugin, then publishes a GitHub release carrying the APK and rigPlay-plugin.zip.
# - A version with a pre-release suffix (v0.1.0-rc.1) publishes as a pre-release.
# - A tag whose commit is not on main (a test tag on a branch) publishes as a draft.
# - The APK is identity-less (no accessory authentication assets) and unsigned unless the
#   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
#   secrets are set.
# Only the final job holds a token that can write to the repository.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    name: Check tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      draft: ${{ steps.draft.outputs.draft }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      # The tag is the one version string of the project (VERSION); refuse anything else.
      - name: Check tag matches VERSION
        id: version
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match VERSION: expected 'v${version}'"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      # Before anything is built: a tag with no notes is a mistake to catch while it is only a tag.
      - name: Check the changelog has a section for the tag
        run: python3 scripts/changelog_section.py "${GITHUB_REF_NAME}" > /dev/null
      - name: Draft unless the tagged commit is on main
        id: draft
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "draft=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${GITHUB_REF_NAME} is not on main; the release will be a draft"
            echo "draft=true" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      # mobile/build.gradle.kts signs the release build only when ANDROID_KEYSTORE_PATH is set.
      - name: Provide the release keystore when configured
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64}" ]; then
            printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
            echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret; building an unsigned APK"
          fi
      - name: Unit tests and release build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :mobile:assembleRelease --stacktrace
      - name: Name the APK
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          out=mobile/build/outputs/apk/release
          if [ -f "${out}/mobile-release.apk" ]; then
            cp "${out}/mobile-release.apk" "dist/rigPlay-${VERSION}.apk"
          else
            cp "${out}/mobile-release-unsigned.apk" "dist/rigPlay-${VERSION}-unsigned.apk"
          fi
          rm -f "${RUNNER_TEMP}/release.jks"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: rigplay-apk
          path: dist/*.apk
          if-no-files-found: error

  plugin:
    name: SimHub plugin
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test plugin logic
        run: dotnet test plugin/RigPlay.Tests
      - name: Build plugin
        run: dotnet build plugin/RigPlay -c Release
      - name: Package plugin
        run: |
          set -euo pipefail
          mkdir -p dist
          files=(plugin/RigPlay/bin/Release/net48/RigPlay.dll)
          if [ -f plugin/INSTALL.md ]; then files+=(plugin/INSTALL.md); fi
          zip -j dist/rigPlay-plugin.zip "${files[@]}"
          unzip -l dist/rigPlay-plugin.zip
      - uses: actions/upload-artifact@v4
        with:
          name: rigplay-plugin
          path: dist/rigPlay-plugin.zip
          if-no-files-found: error

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [check, android, plugin]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Builds nothing; checks out only so that CHANGELOG.md is here to read.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rigplay-apk
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: rigplay-plugin
          path: dist/
      - name: List release files
        run: ls -l dist/
      # The release body is the changelog's own section for this version.
      - name: Take the release notes from the changelog
        run: python3 scripts/changelog_section.py "${GITHUB_REF_NAME}" --out release-body.md
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: rigPlay ${{ needs.check.outputs.version }}
          files: |
            dist/*.apk
            dist/rigPlay-plugin.zip
          body_path: release-body.md
          fail_on_unmatched_files: true
          draft: ${{ needs.check.outputs.draft == 'true' }}
          prerelease: ${{ contains(needs.check.outputs.version, '-') }}
